<title>Ai Harbinger Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito+Sans:opsz,wght@6..12,600;6..12,800&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #0b0714;
    --panel: rgba(18, 11, 30, 0.78);
    --panel-edge: rgba(255, 64, 226, 0.28);
    --ink: #f6e9fa;
    --muted: #b7a6c9;
    --magenta: #ff40e2;
    --green: #46ffaa;
    --chip: rgba(255, 255, 255, 0.06);
    --chip-on: rgba(255, 64, 226, 0.22);
  }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 600 14px/1.35 "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .top {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    pointer-events: none;
  }
  .brand {
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 14px;
    padding: 10px 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    max-width: min(78vw, 360px);
  }
  .brand h1 {
    margin: 0; font: 400 20px/1.1 "Russo One", "Arial Black", system-ui, sans-serif;
    letter-spacing: 0.04em; text-transform: uppercase;
    text-shadow: 0 0 14px rgba(255, 64, 226, 0.55);
  }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .rig {
    font: 800 11px/1 "Nunito Sans", system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--green); background: var(--panel); border: 1px solid rgba(70, 255, 170, 0.3);
    padding: 8px 10px; border-radius: 999px; white-space: nowrap;
  }

  .dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  .hint { color: var(--muted); font-size: 12px; text-shadow: 0 1px 6px #000; }
  .controls {
    pointer-events: auto;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 18px;
    padding: 8px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    max-width: 560px;
  }
  .group { display: flex; gap: 6px; }
  .group + .group { padding-left: 6px; border-left: 1px solid rgba(255, 255, 255, 0.1); }
  button {
    font: 800 13px/1 "Nunito Sans", system-ui, sans-serif; color: var(--ink);
    background: var(--chip); border: 1px solid transparent; border-radius: 12px;
    min-height: 40px; padding: 0 13px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  button:hover { background: rgba(255, 255, 255, 0.11); }
  button[aria-pressed="true"] { background: var(--chip-on); border-color: var(--magenta); color: #fff; }
  button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  @media (max-width: 460px) {
    .group + .group { border-left: 0; padding-left: 0; }
    button { padding: 0 11px; }
  }

  #status {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 400 16px "Russo One", system-ui, sans-serif; letter-spacing: 0.08em; color: var(--muted);
    pointer-events: none;
  }
  #status[hidden] { display: none; }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Roblox classic clothing template regions (x, y, w, h) on the 585x559 sheet.
const TORSO = { F: [231, 74, 128, 128], B: [427, 74, 128, 128], R: [165, 74, 64, 128], L: [361, 74, 64, 128], U: [231, 8, 128, 64], D: [231, 204, 128, 64] };
const LIMB_R = { L: [19, 355, 64, 128], B: [85, 355, 64, 128], R: [151, 355, 64, 128], F: [217, 355, 64, 128], U: [217, 289, 64, 64], D: [217, 485, 64, 64] };
const LIMB_L = { F: [308, 355, 64, 128], L: [374, 355, 64, 128], B: [440, 355, 64, 128], R: [506, 355, 64, 128], U: [308, 289, 64, 64], D: [308, 485, 64, 64] };

const C = {
  skin: 0xf4e2ee, hair: 0x2238b2, hairDark: 0x10186a, earIn: 0xf27cde, cloak: 0x1e4a3a, cloakLight: 0x3a7456,
  gold: 0xd6ac52, feather: 0xde28a2, bow: 0x262032, leather: 0x5c3828, leaf: 0x4c9460,
};

// ---------------------------------------------------------------- renderer
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 200);
camera.position.set(0, 3.3, 11.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.7, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI * 0.53;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.3, 0.15, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- environment
function canvasTex(w, h, draw) {
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  draw(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const skyDay = canvasTex(4, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, "#5c9fe0"); gr.addColorStop(0.55, "#a9d0f2"); gr.addColorStop(1, "#dbeaf6");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const skyNeon = canvasTex(4, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, "#07040d"); gr.addColorStop(0.6, "#1a0822"); gr.addColorStop(1, "#2a0a30");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
function gridTex(base, line, glow) {
  const t = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    if (glow) { g.shadowColor = line; g.shadowBlur = 10; }
    g.strokeStyle = line; g.lineWidth = 3;
    g.strokeRect(1.5, 1.5, w - 3, h - 3);
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(24, 24);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const floorDay = gridTex("#6b6e74", "#7d8087", false);
const floorNeon = gridTex("#0d0714", "#b0209c", true);
const floorMat = new THREE.MeshStandardMaterial({ map: floorDay, roughness: 0.95 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(96, 96), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// a few classic bricks so it reads as a sandbox
const props = new THREE.Group();
[[-6, 0.5, -5, 2, 1, 2, 0xc4281c], [-6, 1.5, -5, 2, 1, 2, 0x0d69ac], [6.5, 0.5, -7, 4, 1, 2, 0xf5cd30], [7.5, 1.5, -7, 2, 1, 2, 0x4b974b]]
  .forEach(([x, y, z, w, h, d, col]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: col, roughness: 0.6 }));
    m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; props.add(m);
  });
scene.add(props);

const hemi = new THREE.HemisphereLight(0xdfeeff, 0x4a4450, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(5, 10, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 8, bottom: -2, near: 1, far: 30 });
scene.add(sun);
const rim = new THREE.PointLight(0xff40e2, 0, 14, 1.6);
rim.position.set(0, 5.5, -3);
scene.add(rim);
const fill = new THREE.PointLight(0x46ffaa, 0, 10, 1.8);
fill.position.set(-3.5, 2.5, 2.5);
scene.add(fill);

// ---------------------------------------------------------------- helpers
const neon = (hex, k = 3) => new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k), toneMapped: false });
const toonRamp = (() => {
  const t = new THREE.DataTexture(new Uint8Array([90, 165, 225, 255]), 4, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
})();
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: toonRamp, ...extra });
const Y = new THREE.Vector3(0, 1, 0);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function rod(a, b, r, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dir.length(), 8), mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(Y, dir.normalize());
  return m;
}
function starShape(r, inner = 0.45) {
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * inner : r, a = Math.PI / 2 + i * Math.PI / 5;
    i ? s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  return s;
}
function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}

// Anime ink lines: an inverted hull pushed out along the normals.
const outlineCache = new Map();
function outlineMat(th) {
  if (!outlineCache.has(th)) {
    outlineCache.set(th, new THREE.ShaderMaterial({
      uniforms: { th: { value: th }, col: { value: new THREE.Color(0x160a22) } },
      vertexShader: "uniform float th; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * th, 1.0); }",
      fragmentShader: "uniform vec3 col; void main(){ gl_FragColor = vec4(col, 1.0); }",
      side: THREE.BackSide,
    }));
  }
  return outlineCache.get(th);
}
function ink(mesh, th = 0.01) {
  const o = new THREE.Mesh(mesh.geometry, outlineMat(th));
  o.raycast = () => {};
  o.userData.outline = true;
  mesh.add(o);
  return mesh;
}
const shadowAll = (root) => root.traverse((m) => {
  if (m.isMesh && !m.userData.outline && !m.material.isMeshBasicMaterial) m.castShadow = true;
});

// Rows r0..r1 of one template panel, backed with skin colour like Roblox does.
function slice(img, [x, y, w, h], r0 = 0, r1 = h) {
  const sh = r1 - r0;
  const t = canvasTex(w * 2, Math.max(2, sh * 2), (g, W, H) => {
    g.fillStyle = "#f4e2ee"; g.fillRect(0, 0, W, H);
    g.drawImage(img, x, y + r0, w, sh, 0, 0, W, H);
  });
  t.anisotropy = 8;
  return t;
}
// R15 parts take a horizontal band of the classic template (upper arm = top of the arm panels, etc.).
// Material order matches BoxGeometry: +X (L), -X (R), top, bottom, +Z front, -Z back.
function partMats(img, map, r0, r1, capTop, capBottom) {
  const side = (k) => slice(img, map[k], r0, r1);
  const top = capTop ? slice(img, map.U) : slice(img, map.F, r0, r0 + 1);
  const bottom = capBottom ? slice(img, map.D) : slice(img, map.F, r1 - 1, r1);
  return [side("L"), side("R"), top, bottom, side("F"), side("B")].map((map) => toon(0xffffff, { map }));
}
// Rounded, tapered box: keeps the box's per-face UVs so the template lands where Roblox puts it.
function shapedPart(w, h, d, mats, prof = {}) {
  const g = new THREE.BoxGeometry(w, h, d, 6, 14, 5);
  const P = g.attributes.position, N = g.attributes.normal;
  const p = prof.p ?? 2.6, sx = prof.sx ?? (() => 1), sz = prof.sz ?? (() => 1), dome = prof.dome ?? 0.04;
  const n = new THREE.Vector3();
  for (let i = 0; i < P.count; i++) {
    const y = P.getY(i), t = Math.min(1, Math.max(0, y / h + 0.5));
    let nx = P.getX(i) / (w / 2), nz = P.getZ(i) / (d / 2);
    const m = Math.max(Math.abs(nx), Math.abs(nz));
    if (m > 1e-5) {
      const k = 1 / Math.pow(Math.abs(nx / m) ** p + Math.abs(nz / m) ** p, 1 / p);
      nx *= k; nz *= k;
    }
    const ax = (w / 2) * sx(t), az = (d / 2) * sz(t);
    let X = nx * ax, Z = nz * az, Yv = y;
    if (prof.bump && nz > 0) Z += prof.bump(t, nx);
    const isSide = Math.abs(N.getY(i)) < 0.5;
    if (!isSide) Yv = Math.sign(y) * (h / 2 + dome * (1 - Math.min(1, m * m)));
    P.setXYZ(i, X, Yv, Z);
    if (isSide) {
      n.set(Math.sign(nx) * Math.abs(nx) ** (p - 1) / ax, 0, Math.sign(nz) * Math.abs(nz) ** (p - 1) / az).normalize();
      N.setXYZ(i, n.x, n.y, n.z);
    }
  }
  N.needsUpdate = true;
  const mesh = new THREE.Mesh(g, mats);
  mesh.receiveShadow = true;
  return ink(mesh, prof.ink ?? 0.012);
}
function joint(parent, x, y, z = 0) {
  const j = new THREE.Group();
  j.position.set(x, y, z);
  parent.add(j);
  return j;
}

// Anime head: rounded cranium tapering to a small pointed chin.
function animeHeadGeo() {
  const g = new THREE.SphereGeometry(0.5, 64, 44);
  const P = g.attributes.position;
  for (let i = 0; i < P.count; i++) {
    let x = P.getX(i) * 0.9, y = P.getY(i), z = P.getZ(i) * 0.92;
    if (y < 0) {
      const s = Math.min(1, -y / 0.5), f = s ** 1.6;
      x *= 1 - 0.44 * f; z *= 1 - 0.2 * f;
      if (z > 0) z += 0.05 * s * s;
      y *= 1 + 0.1 * s;
    } else { x *= 1.04; z *= 1.03; }
    P.setXYZ(i, x, y, z);
  }
  g.computeVertexNormals();
  return g;
}
// Front-facing triangles of the head, UV-projected from the front for the face decal.
function faceGeo(headGeo, FW = 0.9, FH = 0.9, FY = -0.08) {
  const src = headGeo.toNonIndexed(), P = src.attributes.position, N = src.attributes.normal;
  const pos = [], nor = [], uv = [];
  for (let i = 0; i < P.count; i += 3) {
    if ((N.getZ(i) + N.getZ(i + 1) + N.getZ(i + 2)) / 3 < 0.2) continue;
    for (let j = i; j < i + 3; j++) {
      const x = P.getX(j), y = P.getY(j), z = P.getZ(j);
      pos.push(x * 1.006, y * 1.006, z * 1.006 + 0.002);
      nor.push(N.getX(j), N.getY(j), N.getZ(j));
      uv.push(x / FW + 0.5, (y - FY) / FH + 0.5);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  return g;
}
// A tapered hair lock hanging from its root, flattened and optionally curved.
function strand(mat, len, rad, { flat = 0.5, bendX = 0, bendZ = 0 } = {}) {
  const g = new THREE.ConeGeometry(rad, len, 7, 6);
  g.rotateX(Math.PI);
  g.translate(0, -len / 2, 0);
  const P = g.attributes.position;
  for (let i = 0; i < P.count; i++) {
    const s = -P.getY(i) / len;
    P.setXYZ(i, P.getX(i) + bendX * s * s, P.getY(i), P.getZ(i) * flat + bendZ * s * s);
  }
  g.computeVertexNormals();
  return ink(new THREE.Mesh(g, mat), 0.006);
}
// Green cloak cloth with gold trim and the leaf-shaped hem (leaves cut out with alpha).
function cloakTexture(W, H, hemY, sides) {
  const t = canvasTex(W, H, (g) => {
    const gr = g.createLinearGradient(0, 0, 0, hemY);
    gr.addColorStop(0, "#2d6c51"); gr.addColorStop(1, "#1b4535");
    g.fillStyle = gr; g.fillRect(0, 0, W, hemY);
    for (let x = 18; x < W; x += 44) {
      g.fillStyle = "rgba(6,22,16,0.35)"; g.fillRect(x, 0, 7, hemY);
      g.fillStyle = "rgba(130,200,160,0.12)"; g.fillRect(x + 9, 0, 4, hemY);
    }
    const leaf = (x, y, L, wd, col) => {
      g.save(); g.translate(x, y);
      g.fillStyle = col; g.strokeStyle = "#12302a"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(wd / 2, L * 0.45, 0, L); g.quadraticCurveTo(-wd / 2, L * 0.45, 0, 0);
      g.fill(); g.stroke();
      g.beginPath(); g.moveTo(0, 4); g.lineTo(0, L * 0.85); g.stroke();
      g.restore();
    };
    const L = H - hemY;
    for (let x = 0; x < W + 22; x += 22) leaf(x + 11, hemY - 8, L * 0.98, 26, "#2f7a52");
    for (let x = 0; x < W + 22; x += 22) leaf(x, hemY - 4, L * 0.9, 24, "#4c9460");
    g.fillStyle = "#d6ac52"; g.fillRect(0, hemY - 10, W, 6);
    if (sides) { g.fillRect(0, 0, 7, hemY); g.fillRect(W - 7, 0, 7, hemY); }
  });
  t.anisotropy = 8;
  return t;
}
function brooch(size) {
  const b = new THREE.Group();
  const d = ink(new THREE.Mesh(new THREE.OctahedronGeometry(size), toon(C.gold)), 0.006);
  d.scale.set(0.8, 1, 0.3);
  const s = new THREE.Mesh(new THREE.ShapeGeometry(starShape(size * 0.5)), neon(0x46ffaa, 2.4));
  s.position.z = size * 0.32;
  b.add(d, s);
  return b;
}

// ---------------------------------------------------------------- character
async function build() {
  const [shirt, pants, faceImg] = await Promise.all(["shirt.png", "pants.png", "face.png"].map(loadImage));
  const rigRoot = new THREE.Group();
  const extras = new THREE.Group();
  const skin = toon(C.skin);

  // torso: UpperTorso takes rows 0-96 of the torso panels (corset, necklace), LowerTorso the belt rows
  const upper = shapedPart(0.92, 1.0, 0.5, partMats(shirt, TORSO, 0, 96, true, false), {
    sx: (t) => 0.72 + 0.28 * Math.sin(Math.min(1, t / 0.7) * Math.PI / 2),
    sz: (t) => 0.8 + 0.2 * Math.sin(Math.min(1, t / 0.6) * Math.PI / 2) - 0.12 * Math.max(0, (t - 0.8) / 0.2),
    bump: (t, nx) => 0.075 * Math.exp(-(((t - 0.6) / 0.14) ** 2)) * Math.exp(-(((Math.abs(nx) - 0.42) / 0.3) ** 2)),
  });
  upper.position.y = 3.66;
  const lower = shapedPart(0.9, 0.6, 0.52, partMats(shirt, TORSO, 96, 128, false, true), {
    sx: (t) => 1 - 0.26 * t ** 1.2, sz: (t) => 0.95 - 0.1 * t,
  });
  lower.position.y = 2.9;
  rigRoot.add(upper, lower);

  // legs (Pants): thigh, calf/boot, foot
  const legs = {};
  for (const [side, map] of [["R", LIMB_R], ["L", LIMB_L]]) {
    const s = side === "R" ? -1 : 1;
    const hip = joint(rigRoot, 0.23 * s, 2.72);
    const thigh = shapedPart(0.4, 1.3, 0.42, partMats(pants, map, 0, 64, true, false), { sx: (t) => 0.78 + 0.22 * t, sz: (t) => 0.8 + 0.2 * t });
    thigh.position.y = -0.62;
    const knee = joint(hip, 0, -1.25);
    const calf = shapedPart(0.32, 1.22, 0.34, partMats(pants, map, 64, 118, false, false), {
      sx: (t) => 0.82 + 0.18 * Math.sin(Math.PI * Math.min(1, t * 1.25)), sz: (t) => 0.85 + 0.15 * Math.sin(Math.PI * Math.min(1, t * 1.25)),
    });
    calf.position.y = -0.6;
    const ankle = joint(knee, 0, -1.2);
    const foot = shapedPart(0.3, 0.2, 0.5, partMats(pants, map, 118, 128, false, true), { dome: 0.02, ink: 0.008 });
    foot.position.set(0, -0.17, 0.08);
    hip.add(thigh); knee.add(calf); ankle.add(foot);
    legs[side] = { hip, knee };
  }

  // arms (Shirt): cloak sleeve, gloved forearm, hand
  const arms = {};
  for (const [side, map] of [["R", LIMB_R], ["L", LIMB_L]]) {
    const s = side === "R" ? -1 : 1;
    const shoulder = joint(rigRoot, 0.56 * s, 4.0);
    shoulder.rotation.z = 0.13 * s;
    const up = shapedPart(0.24, 0.95, 0.26, partMats(shirt, map, 0, 60, true, false), { sx: (t) => 0.85 + 0.15 * t, ink: 0.009 });
    up.position.y = -0.45;
    const elbow = joint(shoulder, 0, -0.92);
    elbow.rotation.x = -0.12;
    const fore = shapedPart(0.21, 0.82, 0.22, partMats(shirt, map, 60, 112, false, false), { sx: (t) => 0.8 + 0.2 * t, ink: 0.009 });
    fore.position.y = -0.4;
    const wrist = joint(elbow, 0, -0.82);
    const hand = shapedPart(0.17, 0.28, 0.1, partMats(shirt, map, 112, 128, false, true), { dome: 0.03, ink: 0.007 });
    hand.position.y = -0.13;
    shoulder.add(up); elbow.add(fore); wrist.add(hand);
    arms[side] = { shoulder, elbow, wrist };
  }

  // neck, choker, head with the face decal projected onto the front
  const neck = ink(new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.095, 0.32, 20), skin), 0.008);
  neck.position.y = 4.24;
  const choker = new THREE.Mesh(new THREE.TorusGeometry(0.093, 0.02, 10, 32), toon(0x141018));
  choker.rotation.x = Math.PI / 2; choker.position.y = 4.24;
  const chokerRing = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.007, 8, 16), toon(C.gold));
  chokerRing.position.set(0, 4.2, 0.1);
  rigRoot.add(neck, choker, chokerRing);

  const head = new THREE.Group();
  head.position.y = 4.86;
  rigRoot.add(head);
  const headGeo = animeHeadGeo();
  head.add(ink(new THREE.Mesh(headGeo, skin), 0.01));
  const faceTex = new THREE.Texture(faceImg);
  faceTex.colorSpace = THREE.SRGBColorSpace; faceTex.anisotropy = 8; faceTex.needsUpdate = true;
  const face = new THREE.Mesh(faceGeo(headGeo), new THREE.MeshToonMaterial({
    map: faceTex, gradientMap: toonRamp, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2,
  }));
  head.add(face);

  // ---- 3D extras: hair, ears, cap, halo, cloak, quiver --------------------
  const hx = new THREE.Group();
  hx.position.copy(head.position);
  extras.add(hx);

  const hairA = toon(0x2a44c8, { emissive: 0x12083a });
  const hairB = toon(0x3d62e6, { emissive: 0x12083a });
  const hairC = toon(0x1c2b94, { emissive: 0x12083a });
  const scalp = ink(new THREE.Mesh(new THREE.SphereGeometry(0.535, 48, 24, 0, Math.PI * 2, 0, Math.PI * 0.42), hairA), 0.008);
  scalp.position.y = 0.02; scalp.scale.x = 0.98;
  // rounded bob volume around the back and sides (front left open for the face)
  const bob = ink(new THREE.Mesh(new THREE.SphereGeometry(0.575, 48, 24, Math.PI / 2 + 1.15, Math.PI * 2 - 2.3, Math.PI * 0.2, Math.PI * 0.58), toon(0x2a44c8, { emissive: 0x12083a, side: THREE.DoubleSide })), 0.008);
  bob.position.y = -0.04; bob.scale.set(1.02, 1.08, 1.0);
  hx.add(scalp, bob);
  for (let a = Math.PI / 2 - 0.5, i = 0; a <= Math.PI * 1.5 + 0.51; a += 0.34, i++) {
    const st = strand(i % 2 ? hairA : hairC, 0.2 + (i % 3) * 0.05, 0.14, { flat: 0.45, bendZ: -0.09 });
    st.position.set(Math.sin(a) * 0.54, -0.4, Math.cos(a) * 0.54);
    st.rotation.y = a;
    hx.add(st);
  }
  [-60, -42, -24, -8, 8, 24, 42, 60].forEach((deg, i) => {
    const a = THREE.MathUtils.degToRad(deg);
    const st = strand(i % 3 === 1 ? hairB : hairA, 0.25 + (i % 2) * 0.07, 0.12, { flat: 0.38, bendZ: 0.05 });
    st.position.set(Math.sin(a) * 0.5, 0.4, Math.cos(a) * 0.5);
    st.rotation.y = a;
    hx.add(st);
  });
  [-1, 1].forEach((s) => {
    [[70, 0.9, 0.11, hairA], [86, 0.72, 0.1, hairC]].forEach(([deg, len, rad, mat]) => {
      const a = THREE.MathUtils.degToRad(deg) * s;
      const st = strand(mat, len, rad, { flat: 0.45, bendZ: 0.06 });
      st.position.set(Math.sin(a) * 0.5, 0.26, Math.cos(a) * 0.5);
      st.rotation.y = a;
      hx.add(st);
    });
    // violet rim light along the side locks, as in the art
    hx.add(rod(V(0.49 * s, 0.2, 0.2), V(0.47 * s, -0.55, 0.26), 0.008, neon(0xc446e2, 1.5)));
  });

  // cat ears
  const earShape = new THREE.Shape();
  earShape.moveTo(-0.15, 0); earShape.quadraticCurveTo(-0.13, 0.2, 0, 0.36); earShape.quadraticCurveTo(0.1, 0.18, 0.15, 0); earShape.quadraticCurveTo(0, 0.03, -0.15, 0);
  const earGeo = new THREE.ExtrudeGeometry(earShape, { depth: 0.05, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2, curveSegments: 14 });
  earGeo.translate(0, 0, -0.025);
  const innerShape = new THREE.Shape(earShape.getPoints(14).map((p) => new THREE.Vector2(p.x * 0.6, p.y * 0.66 + 0.03)));
  [-1, 1].forEach((s) => {
    const ear = new THREE.Group();
    ear.position.set(0.36 * s, 0.42, 0.02);
    ear.rotation.set(-0.1, 0.3 * s, -0.4 * s);
    ear.add(ink(new THREE.Mesh(earGeo, toon(0x4a3fc4)), 0.008));
    const inner = new THREE.Mesh(new THREE.ShapeGeometry(innerShape), toon(C.earIn, { emissive: 0x3a0c30 }));
    inner.position.z = 0.05;
    ear.add(inner);
    for (let k = -1; k <= 1; k++) {
      const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.14, 5), toon(0xf6eeff));
      tuft.position.set(k * 0.04, 0.07, 0.06); tuft.rotation.z = -k * 0.35;
      ear.add(tuft);
    }
    hx.add(ear);
  });

  // Robin Hood cap: upturned brim, peaked crown, gold trim, star badge, magenta feather
  const hat = new THREE.Group();
  hat.position.set(0, 0.26, -0.02); hat.rotation.set(-0.12, 0, 0.06);
  const brim = ink(new THREE.Mesh(new THREE.LatheGeometry([new THREE.Vector2(0.47, -0.02), new THREE.Vector2(0.58, 0), new THREE.Vector2(0.64, 0.07), new THREE.Vector2(0.65, 0.11)], 64), toon(0x3a7a58, { side: THREE.DoubleSide })), 0.008);
  brim.scale.z = 1.12;
  const brimTrim = new THREE.Mesh(new THREE.TorusGeometry(0.65, 0.022, 8, 72), toon(C.gold));
  brimTrim.rotation.x = Math.PI / 2; brimTrim.position.y = 0.11; brimTrim.scale.y = 1.12;
  const crownGeo = new THREE.SphereGeometry(0.5, 56, 24, 0, Math.PI * 2, 0, Math.PI / 2);
  const cp = crownGeo.attributes.position;
  for (let i = 0; i < cp.count; i++) {
    const x = cp.getX(i) * 0.96, y = cp.getY(i), z = cp.getZ(i) * 1.1;
    cp.setXYZ(i, x, y * (1 + 0.9 * Math.max(0, -z) / 0.55), z - 0.3 * (y / 0.5) ** 2);
  }
  crownGeo.computeVertexNormals();
  const crown = ink(new THREE.Mesh(crownGeo, toon(0x2f6e50)), 0.01);
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.48, 0.028, 8, 64), toon(C.gold));
  band.rotation.x = Math.PI / 2; band.position.y = 0.04; band.scale.y = 1.1;
  const badge = brooch(0.09);
  badge.position.set(-0.2, 0.17, 0.5); badge.rotation.y = -0.38;
  const fShape = new THREE.Shape();
  fShape.moveTo(0, 0); fShape.quadraticCurveTo(0.2, 0.6, 0.04, 1.25); fShape.quadraticCurveTo(-0.14, 0.6, 0, 0);
  const feather = ink(new THREE.Mesh(new THREE.ShapeGeometry(fShape, 18), toon(C.feather, { emissive: 0x6a0a50, side: THREE.DoubleSide })), 0.006);
  feather.position.set(0.36, 0.1, 0.12); feather.rotation.set(-0.95, 0.25, -0.55);
  hat.add(brim, brimTrim, crown, band, badge, feather);
  hx.add(hat);

  const halo = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.028, 12, 72), neon(0xff40e2, 1.7));
  halo.rotation.x = Math.PI / 2 - 0.2;
  halo.position.y = 1.08;
  hx.add(halo);

  // cloak: hood roll, capelet with leaf hem open at the front, long cape behind
  const hoodArc = new THREE.Mesh(new THREE.TorusGeometry(0.21, 0.085, 12, 40, Math.PI * 1.4), toon(0x2f6e50));
  hoodArc.rotation.z = -0.2 * Math.PI;
  const hood = new THREE.Group();
  hood.rotation.x = -Math.PI / 2; hood.position.set(0, 4.19, -0.02); hood.scale.set(1.15, 1, 1);
  hood.add(ink(hoodArc, 0.008));
  const mantle = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.78, 0.75, 72, 8, true, 0.6, Math.PI * 2 - 1.2),
    toon(0xffffff, { map: cloakTexture(512, 256, 200, true), side: THREE.DoubleSide, alphaTest: 0.5 }));
  mantle.position.y = 3.86; mantle.scale.z = 0.66;
  const capeGeo = new THREE.CylinderGeometry(0.5, 0.86, 2.3, 56, 12, true, Math.PI - 1.15, 2.3);
  const kp = capeGeo.attributes.position;
  for (let i = 0; i < kp.count; i++) {
    const x = kp.getX(i), y = kp.getY(i), z = kp.getZ(i), v = (y + 1.15) / 2.3;
    const f = 1 + 0.06 * Math.sin(Math.atan2(x, z) * 9) * (1 - v);
    kp.setXYZ(i, x * f, y, z * f);
  }
  capeGeo.computeVertexNormals();
  const cape = new THREE.Mesh(capeGeo, toon(0xffffff, { map: cloakTexture(512, 512, 450, true), side: THREE.DoubleSide, alphaTest: 0.5 }));
  cape.position.y = 2.85; cape.scale.z = 0.62;
  extras.add(hood, mantle, cape);
  [-1, 1].forEach((s) => {
    const b = brooch(0.07);
    b.position.set(0.27 * s, 3.95, 0.29); b.rotation.y = 0.5 * s;
    extras.add(b);
  });

  // quiver over the cape, arrows rising past the character's left shoulder
  const quiver = new THREE.Group();
  quiver.position.set(0.12, 3.25, -0.52); quiver.rotation.set(0.15, 0, -0.55);
  quiver.add(ink(new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 1.0, 20), toon(C.leather)), 0.008));
  [0.45, -0.45].forEach((y) => {
    const r = new THREE.Mesh(new THREE.TorusGeometry(y > 0 ? 0.122 : 0.103, 0.018, 8, 28), toon(C.gold));
    r.rotation.x = Math.PI / 2; r.position.y = y; quiver.add(r);
  });
  const qBadge = brooch(0.08);
  qBadge.position.set(0, 0.05, -0.12); qBadge.rotation.y = Math.PI;
  quiver.add(qBadge);
  [[-0.05, 0.02], [0.04, -0.03], [0.0, 0.05], [0.06, 0.04]].forEach(([x, z], i) => {
    const a = V(x, 0.4, z), b = V(x * 1.6, 0.95 + i * 0.03, z * 1.4);
    quiver.add(rod(a, b, 0.012, toon(0x3a2418)));
    [0, Math.PI / 2].forEach((ry) => {
      const fl = new THREE.Mesh(new THREE.PlaneGeometry(0.07, 0.2), i === 2 ? neon(0x46ffaa, 1.8) : toon(C.leaf, { side: THREE.DoubleSide }));
      fl.material.side = THREE.DoubleSide;
      fl.position.copy(b).lerp(a, 0.14); fl.rotation.y = ry;
      quiver.add(fl);
    });
  });
  extras.add(quiver);

  // bow in the right hand: dark recurve limbs, neon green glyphs, glowing magenta string
  const bowG = new THREE.Group();
  const z = 0.14;
  const curve = new THREE.CatmullRomCurve3([V(0.26, 1.3, z), V(0.2, 1.12, z), V(0.02, 0.55, z), V(-0.03, -0.13, z), V(0.02, -0.8, z), V(0.2, -1.38, z), V(0.26, -1.55, z)]);
  bowG.add(ink(new THREE.Mesh(new THREE.TubeGeometry(curve, 90, 0.035, 8), toon(C.bow)), 0.006));
  bowG.add(rod(V(0.26, 1.3, z), V(0.26, -1.55, z), 0.008, neon(0xff40e2, 3)));
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3, 12), toon(C.leather));
  grip.position.set(-0.03, -0.13, z);
  bowG.add(grip);
  const glyph = neon(0x46ffaa, 2.6);
  [0.14, 0.26, 0.74, 0.86].forEach((t) => {
    const p = curve.getPointAt(t).add(V(0, 0, 0.04));
    bowG.add(rod(V(p.x - 0.05, p.y - 0.05, p.z), p, 0.01, glyph), rod(V(p.x + 0.05, p.y - 0.05, p.z), p, 0.01, glyph), rod(p, V(p.x, p.y - 0.09, p.z), 0.009, glyph));
  });
  arms.R.wrist.add(bowG);

  rigRoot.add(extras);
  shadowAll(rigRoot);
  scene.add(rigRoot);
  return { rigRoot, extras, bowG, halo, arms, legs };
}

// ---------------------------------------------------------------- UI state
const state = { spin: !reduceMotion, walk: false, extras: true, neon: false, camGoal: null };
const $ = (id) => document.getElementById(id);
function press(btn, on) { btn.setAttribute("aria-pressed", on ? "true" : "false"); }
press($("btnSpin"), state.spin);

function applyScene() {
  scene.background = state.neon ? skyNeon : skyDay;
  scene.fog = state.neon ? new THREE.Fog(0x14061c, 14, 42) : new THREE.Fog(0xcfe3f4, 30, 90);
  floorMat.map = state.neon ? floorNeon : floorDay; floorMat.needsUpdate = true;
  hemi.intensity = state.neon ? 0.35 : 1.1;
  hemi.color.set(state.neon ? 0x8a6cff : 0xdfeeff);
  sun.intensity = state.neon ? 0.9 : 2.2;
  sun.color.set(state.neon ? 0xc8b8ff : 0xffffff);
  rim.intensity = state.neon ? 9 : 0;
  fill.intensity = state.neon ? 5 : 0;
  props.visible = !state.neon;
  bloom.strength = state.neon ? 0.75 : 0.3;
}
applyScene();

let rig;
build().then((r) => { rig = r; $("status").hidden = true; }).catch((e) => {
  $("status").textContent = "Couldn't load the textures - reload the page to try again.";
  console.error(e);
});

function goView(back) {
  state.spin = false; press($("btnSpin"), false);
  state.camGoal = { theta: back ? Math.PI : 0, phi: Math.PI / 2 - 0.05 };
  $("hint").textContent = back ? "Back view · cape, leaf hem, quiver" : "Front view · corset, brooches, bow";
}
$("btnFront").onclick = () => goView(false);
$("btnBack").onclick = () => goView(true);
$("btnSpin").onclick = () => { state.spin = !state.spin; press($("btnSpin"), state.spin); };
$("btnWalk").onclick = () => { state.walk = !state.walk; press($("btnWalk"), state.walk); };
$("btnExtras").onclick = () => {
  state.extras = !state.extras; press($("btnExtras"), state.extras);
  if (rig) { rig.extras.visible = state.extras; rig.bowG.visible = state.extras; }
  $("hint").textContent = state.extras ? "Showing hair, ears, cap, halo, cloak, quiver + bow" : "Clothing only · exactly what the uploaded Shirt + Pants give you";
};
$("btnNeon").onclick = () => { state.neon = !state.neon; press($("btnNeon"), state.neon); applyScene(); };
controls.addEventListener("start", () => { state.camGoal = null; });

// ---------------------------------------------------------------- loop
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w < h ? 44 : 32;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

const clock = new THREE.Clock();
let walkT = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (rig) {
    if (state.spin) rig.rigRoot.rotation.y += dt * 0.5;
    else if (state.camGoal) rig.rigRoot.rotation.y *= 0.85;
    const target = state.walk ? 1 : 0;
    walkT += (target - walkT) * Math.min(1, dt * 6);
    const ph = t * 6, swing = Math.sin(ph) * 0.55 * walkT;
    const { arms, legs } = rig;
    legs.R.hip.rotation.x = -swing; legs.L.hip.rotation.x = swing;
    legs.R.knee.rotation.x = (0.05 + 0.7 * Math.max(0, Math.sin(ph + Math.PI / 2))) * walkT;
    legs.L.knee.rotation.x = (0.05 + 0.7 * Math.max(0, Math.sin(ph - Math.PI / 2))) * walkT;
    arms.R.shoulder.rotation.x = swing * 0.8; arms.L.shoulder.rotation.x = -swing * 0.8;
    arms.R.elbow.rotation.x = arms.L.elbow.rotation.x = -0.12 - 0.3 * walkT;
    const breathe = reduceMotion ? 0 : Math.sin(t * 1.6) * 0.02;
    arms.R.shoulder.rotation.z = -0.13 - breathe; arms.L.shoulder.rotation.z = 0.13 + breathe;
    rig.rigRoot.position.y = Math.abs(Math.sin(ph)) * 0.06 * walkT;
    if (!reduceMotion) rig.halo.position.y = 1.08 + Math.sin(t * 2) * 0.03;
  }
  if (state.camGoal) {
    // orbit around the rig instead of cutting through it
    const off = camera.position.clone().sub(controls.target);
    const sph = new THREE.Spherical().setFromVector3(off);
    let dTheta = state.camGoal.theta - sph.theta;
    dTheta = Math.atan2(Math.sin(dTheta), Math.cos(dTheta));
    const k = Math.min(1, dt * 5);
    sph.theta += dTheta * k;
    sph.phi += (state.camGoal.phi - sph.phi) * k;
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph));
    if (Math.abs(dTheta) < 0.005) state.camGoal = null;
  }
  controls.update();
  composer.render();
});
</script>
